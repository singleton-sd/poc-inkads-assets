<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <!-- Master 800x480 B/W house/fallback creative. QR target URL lives in README only. -->
  <rect width="800" height="480" fill="#FFFFFF"/>

  <!-- Left brand column -->
  <g transform="translate(48, 56)">
    <!-- Mono mark adapted from src/logo/sources/mono.svg (64 scaled to 96) -->
    <g transform="scale(1.5)">
      <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="6" stroke="#000000" stroke-width="3.5"/>
      <rect x="12.5" y="12.5" width="17" height="39" fill="#000000"/>
      <rect x="35.5" y="26" width="16" height="4" fill="#000000"/>
      <rect x="35.5" y="34" width="10.4" height="4" fill="#000000"/>
    </g>

    <text x="0" y="148" fill="#000000" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-1">InkAds</text>
    <text x="2" y="178" fill="#000000" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="1.2">BY SINGLETON SD</text>

    <text x="0" y="250" fill="#000000" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700">Advertise here</text>
    <text x="0" y="292" fill="#000000" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">Put your brand on display</text>
    <text x="0" y="336" fill="#000000" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="500">Scan to learn more</text>
  </g>

  <!-- Right QR panel: 260px mark + quiet zone already in qr-go.svg (4 modules) -->
  <g transform="translate(476, 110)">
    <rect x="-12" y="-12" width="284" height="284" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <image href="qr-go.svg" x="0" y="0" width="260" height="260"/>
  </g>
</svg>
